<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{email.reset_password.subject}">Reset Password</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background-color: white;
      padding: 30px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 20px;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 th:text="#{email.reset_password.title}">Reset your password</h2>
  <p th:text="#{email.reset_password.intro}">We received a request to reset your password.</p>
  <a class="btn" th:href="${resetLink}" th:text="#{email.reset_password.button}">Reset Password</a>
  <p th:text="#{email.reset_password.outro}">If you didn’t request this, you can ignore this
    email.</p>
  <div class="footer" th:text="#{email.footer}">This is an automated message.</div>
</div>
</body>
</html>
