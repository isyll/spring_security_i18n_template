spring:
  application:
    name: demo-dev
    version: 1.0.0-dev

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_STARTTLS}
    default-encoding: UTF-8
    protocol: ${MAIL_PROTOCOL}
    test-connection: true

  messages:
    basename: messages
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 100
          max-idle: 30
          min-idle: 10
          max-wait: 2000
          time-between-eviction-runs: 30000
    jpa:
      repositories:
        enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true

  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /v1

springdoc:
  api-docs:
    path: /api-docs

logging:
  level:
    org.springframework: ERROR
    com.example.demo: INFO
    io.swagger.v3: WARN
